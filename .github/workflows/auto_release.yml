name: Auto Release Builder

on:
  push:
    branches:
      - main
    paths:
      - 'kodair_browser/pubspec.yaml' # Triggers automatically when you increment your Flutter version number

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep -oP '^version:\s+\K.*' kodair_browser/pubspec.yaml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Android APK
        working-directory: ./kodair_browser
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: kodair-android-apk
          path: kodair_browser/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Compile Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get Version
        run: |
          $content = Get-Content "kodair_browser/pubspec.yaml" -Raw
          if ($content -match "(?m)^version:\s+(.*?)\s*$") {
            echo "VERSION=$($matches[1])" >> $env:GITHUB_ENV
          }

      - name: Build Desktop Executable
        working-directory: ./kodair_browser
        run: flutter build windows --release --no-tree-shake-icons

      - name: Compile Windows Installer (InnoSetup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: kodair_setup.iss

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: kodair-windows-installer
          path: Output/KodairInstaller.exe

  publish-release:
    name: Draft GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep -oP '^version:\s+\K.*' kodair_browser/pubspec.yaml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Publish Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kodair Browser v${{ env.VERSION }}
          body: "Automated Native Release Pipeline triggered by version increment. \n\nIncludes Android Edge-To-Edge fixes, YouTube Autoplay configurations, and full Windows Installer integrity."
          files: |
            release-binaries/app-release.apk
            release-binaries/KodairInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}